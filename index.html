<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>おだて豚 OCR 精度調整テスト v3</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #222; color: #fff; padding: 10px; padding-bottom: 80px; margin: 0; }
        h1 { font-size: 1.1rem; text-align: center; }
        .controls { background: #333; padding: 12px; border-radius: 8px; margin-bottom: 10px; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        input[type="file"] { width: 100%; font-size: 1rem; color: #fff; }
        #statusText { margin-top: 8px; text-align: center; font-weight: bold; font-size: 0.9rem; }
        .status-idle { color: #aaa; }
        .status-processing { color: #ff9f43; }
        .status-complete { color: #2ecc71; }
        #results-container { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        .result-item { background: #333; padding: 6px 10px; border-radius: 6px; display: flex; align-items: center; justify-content: space-between; border: 1px solid #444; }
        .label-cell { font-size: 0.85rem; color: #ccc; width: 90px; }
        .image-cell { text-align: center; background: #000; border-radius: 4px; padding: 2px; }
        .crop-preview { max-height: 35px; width: auto; display: block; border: 1px solid #555; }
        .ocr-cell { font-size: 1.2rem; font-weight: bold; width: 70px; text-align: right; color: #2ecc71; }
        .raw-text { font-size: 0.7rem; color: #888; margin-right: 5px; }
    </style>
</head>
<body>

<h1>🐷 OCR 精度調整テスト v3</h1>

<div class="controls">
    <input type="file" id="fileInput" accept="image/*">
    <div id="statusText" class="status-idle">スクショを選択してください</div>
</div>

<div id="results-container"></div>

<script>
// 座標微調整：対象ゲームの「数」を除去、ボタン位置を最適化
const cropAreas = [
  // xを 54.0 -> 56.5 に右シフトして「数」を完全に外す、yとhで上下の枠線も除外
  { key: 'target_game', label: '対象ゲーム', x: 56.5, y: 33.6, w: 12.0, h: 3.2, isTargetGame: true },
  { key: 'btn_1_1',     label: '1段:投資',   x: 4.0,  y: 38.0, w: 18.5, h: 4.8 },
  { key: 'btn_1_2',     label: '1段:②',     x: 28.0, y: 38.0, w: 18.5, h: 4.8 },
  { key: 'btn_1_3',     label: '1段:リプ',   x: 52.0, y: 38.0, w: 18.5, h: 4.8 },
  { key: 'btn_1_4',     label: '1段:リプV',  x: 76.0, y: 38.0, w: 18.5, h: 4.8 },
  { key: 'btn_2_1',     label: '2段:羽根拾', x: 4.0,  y: 52.0, w: 18.5, h: 4.8 },
  { key: 'btn_2_2',     label: '2段:V入賞',  x: 28.0, y: 52.0, w: 18.5, h: 4.8 },
  { key: 'btn_2_3',     label: '2段:SP',     x: 52.0, y: 52.0, w: 18.5, h: 4.8 },
  { key: 'btn_2_4',     label: '2段:SPV',    x: 76.0, y: 52.0, w: 18.5, h: 4.8 },
  { key: 'btn_3_1',     label: '3段:拾蹴',   x: 4.0,  y: 66.0, w: 18.5, h: 4.8 },
  { key: 'btn_3_2',     label: '3段:当大',   x: 28.0, y: 66.0, w: 18.5, h: 4.8 },
  { key: 'btn_3_3',     label: '3段:当中',   x: 52.0, y: 66.0, w: 18.5, h: 4.8 },
  { key: 'btn_3_4',     label: '3段:当小',   x: 76.0, y: 66.0, w: 18.5, h: 4.8 },
];

let worker = null;
const fileInput = document.getElementById('fileInput');
const statusText = document.getElementById('statusText');
const container = document.getElementById('results-container');

async function initOCR() {
    statusText.innerText = 'OCR初期化中...';
    worker = await Tesseract.createWorker('eng');
    await worker.setParameters({
        tessedit_char_whitelist: '0123456789-',
        tessedit_pageseg_mode: Tesseract.PSM.SINGLE_LINE
    });
    statusText.innerText = '準備完了（スクショを選択）';
}

fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file || !worker) return;

    container.innerHTML = '';
    statusText.className = 'status-processing';
    statusText.innerText = '画像処理中...';

    const reader = new FileReader();
    reader.onload = (event) => {
        const img = new Image();
        img.onload = () => processImage(img);
        img.src = event.target.result;
    };
    reader.readAsDataURL(file);
});

async function processImage(img) {
    statusText.innerText = '13箇所を認識中...';
    const startTime = performance.now();

    for (let i = 0; i < cropAreas.length; i++) {
        const area = cropAreas[i];
        const base64 = getProcessedCropBase64(img, area);

        const { data: { text } } = await worker.recognize(base64);

        // 数字とハイフンのみ抽出
        let cleaned = text.replace(/[^0-9\-]/g, '').trim();
        
        // 対象ゲーム数にはハイフンは存在しないためハイフンも除去
        if (area.isTargetGame) {
            cleaned = cleaned.replace(/-/g, '');
        }

        if (cleaned === '' || cleaned === '-') cleaned = '-';

        createResultUI(area, base64, cleaned, text);
    }

    const sec = ((performance.now() - startTime) / 1000).toFixed(1);
    statusText.className = 'status-complete';
    statusText.innerText = `解析完了 (${sec}秒)`;
}

function getProcessedCropBase64(imgElement, areaPercent) {
    const imgW = imgElement.width;
    const imgH = imgElement.height;

    const cropX = (areaPercent.x / 100) * imgW;
    const cropY = (areaPercent.y / 100) * imgH;
    const cropW = (areaPercent.w / 100) * imgW;
    const cropH = (areaPercent.h / 100) * imgH;

    // 認識精度向上のため、画像を3倍に拡大してCanvasに展開
    const scale = 3;
    const padding = 15;
    const canvas = document.createElement('canvas');
    canvas.width = (cropW * scale) + (padding * 2);
    canvas.height = (cropH * scale) + (padding * 2);
    const ctx = canvas.getContext('2d');

    // 白背景で塗りつぶし
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const srcCanvas = document.createElement('canvas');
    srcCanvas.width = cropW;
    srcCanvas.height = cropH;
    const srcCtx = srcCanvas.getContext('2d');
    srcCtx.drawImage(imgElement, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

    // 二値化処理
    const imgData = srcCtx.getImageData(0, 0, cropW, cropH);
    const d = imgData.data;
    const threshold = 150; // 閾値を少し下げて文字の輪郭の欠けを防ぐ

    for (let i = 0; i < d.length; i += 4) {
        const gray = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
        const v = (gray > threshold) ? 0 : 255;
        d[i] = d[i+1] = d[i+2] = v;
    }
    srcCtx.putImageData(imgData, 0, 0);

    // 拡大して中央に描画
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(srcCanvas, 0, 0, cropW, cropH, padding, padding, cropW * scale, cropH * scale);

    return canvas.toDataURL('image/png');
}

function createResultUI(area, base64, resultText, rawText) {
    const item = document.createElement('div');
    item.className = 'result-item';

    const label = document.createElement('div');
    label.className = 'label-cell';
    label.innerText = area.label;

    const imgCell = document.createElement('div');
    imgCell.className = 'image-cell';
    const img = new Image();
    img.src = base64;
    img.className = 'crop-preview';
    imgCell.appendChild(img);

    const ocrCell = document.createElement('div');
    ocrCell.className = 'ocr-cell';
    ocrCell.innerHTML = `<span class="raw-text">(${rawText.trim()})</span>${resultText}`;

    item.appendChild(label);
    item.appendChild(imgCell);
    item.appendChild(ocrCell);
    container.appendChild(item);
}

initOCR();
</script>
</body>
</html>
