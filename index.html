<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>おだて豚 解析ダッシュボード v1.3</title>
    <style>
        :root {
            --bg-main: #121216;
            --bg-card: #1b1b22;
            --bg-input: #0f0f13;
            --border-color: #2e2e3d;
            --accent-green: #2ecc71;
            --accent-blue: #3498db;
            --accent-yellow: #f1c40f;
            --accent-red: #e74c3c;
            --text-main: #e0e0e0;
            --text-sub: #888899;
        }
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-main); color: var(--text-main); margin: 0; padding: 8px; padding-bottom: 95px; font-size: 11px; }
        
        .header-wrap { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        h1 { font-size: 0.95rem; margin: 0; color: #fff; display: flex; align-items: center; gap: 4px; }
        .version-badge { background: #e67e22; color: #fff; font-size: 0.65rem; padding: 1px 4px; border-radius: 3px; }
        .btn-settings-toggle { background: #262636; border: 1px solid var(--border-color); color: #ccc; padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; cursor: pointer; }
        
        .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 6px; padding: 6px 8px; margin-bottom: 6px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
        label { font-size: 0.65rem; color: var(--text-sub); display: block; margin-bottom: 1px; }
        input, select { width: 100%; padding: 4px 6px; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 4px; color: #fff; font-size: 0.8rem; }
        button { cursor: pointer; border: none; border-radius: 4px; padding: 4px 8px; font-weight: bold; }
        .btn-save { background: var(--accent-green); color: #000; width: 100%; margin-top: 6px; font-size: 0.85rem; padding: 6px; }
        #status { text-align: center; font-size: 0.75rem; margin-top: 4px; min-height: 1.1em; font-weight: bold; }
        
        /* 1枚画面に収める超コンパクト比較テーブル */
        .table-wrap { overflow-x: auto; margin-top: 4px; }
        table.cmp-table { width: 100%; border-collapse: collapse; font-size: 0.75rem; text-align: center; }
        table.cmp-table th, table.cmp-table td { border: 1px solid var(--border-color); padding: 2px 2px; line-height: 1.25; }
        table.cmp-table th { background: #222230; color: #bbb; font-weight: normal; }
        .sec-head { background: #161620; color: var(--accent-yellow); font-weight: bold; text-align: left; padding-left: 4px !important; font-size: 0.7rem; }
        .col-header { font-size: 0.75rem; font-weight: bold; color: #fff; }
        
        /* ヒキのプラス・マイナスカラー */
        .val-plus { color: #ff6b6b; font-weight: bold; }
        .val-minus { color: #54a0ff; font-weight: bold; }
        .val-total-hiki { font-weight: bold; font-size: 0.85rem; }

        /* 下部固定ポチバー */
        .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #15151e; border-top: 1px solid var(--border-color); padding: 5px 8px; z-index: 100; box-shadow: 0 -3px 8px rgba(0,0,0,0.6); }
        .quick-controls { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
        .pochi-scroll { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 2px; }
        .pochi-btn { flex: 0 0 auto; background: #262636; color: #aaa; border: 1px solid #3d3d52; border-radius: 3px; padding: 4px 8px; font-size: 0.75rem; font-weight: bold; }
        .pochi-btn.active { background: var(--accent-yellow); color: #000; border-color: #f39c12; }
        .badge-btn { background: #323246; color: #fff; font-size: 0.7rem; padding: 3px 6px; border-radius: 3px; }

        /* 設定モーダル */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); z-index: 200; align-items: center; justify-content: center; padding: 12px; }
        .modal.open { display: flex; }
        .modal-content { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; width: 100%; max-width: 400px; padding: 14px; }
    </style>
</head>
<body>

<div class="header-wrap">
    <h1>🐷 おだて豚 解析 <span class="version-badge">v1.3</span></h1>
    <button class="btn-settings-toggle" id="btnOpenSettings">⚙️ 設定</button>
</div>

<!-- 基本情報入力 -->
<div class="card">
    <div class="grid-3">
        <div>
            <label>記録日</label>
            <input type="date" id="inputDate">
        </div>
        <div>
            <label>店舗名</label>
            <input type="text" id="inputShop" placeholder="A店">
        </div>
        <div>
            <label>台番号</label>
            <input type="text" id="inputMachine" placeholder="21">
        </div>
    </div>
    <div class="grid-2" style="margin-top: 4px;">
        <div>
            <label>記録者</label>
            <select id="inputRecorder">
                <option value="自分">自分</option>
                <option value="けん">けん</option>
            </select>
        </div>
        <div>
            <label>過去台の比較</label>
            <select id="selectPastData">
                <option value="">過去データなし</option>
            </select>
        </div>
    </div>
</div>

<!-- スクショ取込カード -->
<div class="card" style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
    <div style="flex: 1;">
        <label>📷 スクショ追加 (10P刻み)</label>
        <input type="file" id="fileInput" accept="image/*" style="padding: 3px;">
    </div>
    <div id="status" style="flex: 1; font-size: 0.75rem;">準備完了</div>
</div>

<!-- マルチ列比較テーブル（全18項目） -->
<div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px;">
        <span style="font-weight: bold; font-size: 0.8rem;">📊 リアルタイム分析</span>
        <button id="btnFetchPast" class="badge-btn" style="background: var(--accent-blue);">過去台同期</button>
    </div>
    
    <div class="table-wrap">
        <table class="cmp-table">
            <thead>
                <tr>
                    <th style="width: 31%;">指標</th>
                    <th style="width: 23%;"><div class="col-header">本日全体</div></th>
                    <th style="width: 23%;"><div class="col-header">選択区間</div></th>
                    <th style="width: 23%;"><div class="col-header">過去同台</div></th>
                </tr>
            </thead>
            <tbody>
                <!-- 打込玉数 -->
                <tr style="background:#20202e; font-weight:bold;">
                    <td>打込玉数</td>
                    <td id="c1_balls">-</td><td id="c2_balls">-</td><td id="c3_balls">-</td>
                </tr>

                <!-- 【現状】 -->
                <tr><td colspan="4" class="sec-head">【現状】</td></tr>
                <tr><td>総ナキ数</td><td id="c1_total_naki">-</td><td id="c2_total_naki">-</td><td id="c3_total_naki">-</td></tr>
                <tr><td>2穴開放確率</td><td id="c1_naki2_prob">-</td><td id="c2_naki2_prob">-</td><td id="c3_naki2_prob">-</td></tr>
                <tr><td>大当り回数</td><td id="c1_hit_cnt">-</td><td id="c2_hit_cnt">-</td><td id="c3_hit_cnt">-</td></tr>
                <tr><td>大当り平均R</td><td id="c1_avg_r">-</td><td id="c2_avg_r">-</td><td id="c3_avg_r">-</td></tr>

                <!-- 【統計】 -->
                <tr><td colspan="4" class="sec-head">【統計】</td></tr>
                <tr><td>ナキ/千</td><td id="c1_naki_k">-</td><td id="c2_naki_k">-</td><td id="c3_naki_k">-</td></tr>
                <tr><td>拾い/千</td><td id="c1_pick_k">-</td><td id="c2_pick_k">-</td><td id="c3_pick_k">-</td></tr>
                <tr><td>拾球率</td><td id="c1_pick_r">-</td><td id="c2_pick_r">-</td><td id="c3_pick_r">-</td></tr>
                <tr><td>大当り確率</td><td id="c1_hit_prob">-</td><td id="c2_hit_prob">-</td><td id="c3_hit_prob">-</td></tr>
                <tr><td>役物確率</td><td id="c1_yaku_prob">-</td><td id="c2_yaku_prob">-</td><td id="c3_yaku_prob">-</td></tr>

                <!-- 【役物】 -->
                <tr><td colspan="4" class="sec-head">【役物】</td></tr>
                <tr><td>蹴り率</td><td id="c1_kick_r">-</td><td id="c2_kick_r">-</td><td id="c3_kick_r">-</td></tr>
                <tr><td>SP発展率</td><td id="c1_sp_r">-</td><td id="c2_sp_r">-</td><td id="c3_sp_r">-</td></tr>
                <tr><td>SP成功率</td><td id="c1_sp_v">-</td><td id="c2_sp_v">-</td><td id="c3_sp_v">-</td></tr>
                <tr><td>リプレイ成功率</td><td id="c1_rep_v">-</td><td id="c2_rep_v">-</td><td id="c3_rep_v">-</td></tr>

                <!-- 【ヒキ】 -->
                <tr><td colspan="4" class="sec-head">【ヒキ】</td></tr>
                <tr style="background:#241d24;"><td>ヒキ総多寡</td><td id="c1_total_hiki">-</td><td id="c2_total_hiki">-</td><td id="c3_total_hiki">-</td></tr>
                <tr><td>Rのヒキ</td><td id="c1_hiki_r">-</td><td id="c2_hiki_r">-</td><td id="c3_hiki_r">-</td></tr>
                <tr><td>SPルートのヒキ</td><td id="c1_hiki_sp">-</td><td id="c2_hiki_sp">-</td><td id="c3_hiki_sp">-</td></tr>
                <tr><td>通常-ﾘﾌﾟのヒキ</td><td id="c1_hiki_rep">-</td><td id="c2_hiki_rep">-</td><td id="c3_hiki_rep">-</td></tr>
                <tr><td>通常ルートのヒキ</td><td id="c1_hiki_norm">-</td><td id="c2_hiki_norm">-</td><td id="c3_hiki_norm">-</td></tr>
            </tbody>
        </table>
    </div>

    <button id="btnSaveToSheet" class="btn-save" style="display:none;">💾 スプレッドシートに保存</button>
</div>

<!-- 下部固定：ポチボタン＆区間セレクター -->
<div class="bottom-bar">
    <div class="quick-controls">
        <div style="display: flex; align-items: center; gap: 4px;">
            <button id="btnRecentSub" class="badge-btn">-</button>
            <span style="font-size: 0.75rem; font-weight: bold;">直近 <span id="spanN">20</span>P</span>
            <button id="btnRecentAdd" class="badge-btn">+</button>
            <button id="btnApplyRecent" class="badge-btn" style="background: var(--accent-yellow); color:#000;">適用</button>
        </div>
        <div>
            <button id="btnSelectAll" class="badge-btn">全選択</button>
            <button id="btnClearSelect" class="badge-btn">解除</button>
        </div>
    </div>
    <div id="pochiButtonContainer" class="pochi-scroll">
        <span style="font-size: 0.7rem; color: #777; line-height: 24px;">スクショを追加するとボタンが並びます</span>
    </div>
</div>

<!-- 設定モーダル -->
<div id="settingsModal" class="modal">
    <div class="modal-content">
        <h3 style="margin-top:0; font-size:0.9rem; border-bottom:1px solid var(--border-color); padding-bottom:6px;">⚙️ API & システム設定</h3>
        <label>Gemini APIキー (Free Tier: 260902hane)</label>
        <input type="password" id="apiKeyInput" placeholder="AIzaSy...">

        <label style="margin-top:6px;">GAS WebApp URL</label>
        <input type="text" id="gasUrlInput" placeholder="https://script.google.com/...">

        <button id="btnCloseSettings" style="background:var(--accent-blue); color:#fff; width:100%; margin-top:12px;">設定を保存して閉じる</button>
    </div>
</div>

<script>
let snapshots = [];
let selectedPochis = new Set();
let pastRecords = [];
let recentN = 20;

// 要素
const inputDate = document.getElementById('inputDate');
const inputShop = document.getElementById('inputShop');
const inputMachine = document.getElementById('inputMachine');
const inputRecorder = document.getElementById('inputRecorder');
const apiKeyInput = document.getElementById('apiKeyInput');
const gasUrlInput = document.getElementById('gasUrlInput');
const fileInput = document.getElementById('fileInput');
const statusDiv = document.getElementById('status');
const btnSaveToSheet = document.getElementById('btnSaveToSheet');
const pochiContainer = document.getElementById('pochiButtonContainer');
const selectPastData = document.getElementById('selectPastData');

// モーダル
const settingsModal = document.getElementById('settingsModal');
document.getElementById('btnOpenSettings').onclick = () => settingsModal.classList.add('open');
document.getElementById('btnCloseSettings').onclick = () => {
    localStorage.setItem('odate_gemini_key', apiKeyInput.value.trim());
    localStorage.setItem('odate_gas_url', gasUrlInput.value.trim());
    settingsModal.classList.remove('open');
};

// 初期値
inputDate.value = new Date().toISOString().split('T')[0];
apiKeyInput.value = localStorage.getItem('odate_gemini_key') || '';
gasUrlInput.value = localStorage.getItem('odate_gas_url') || '';
inputShop.value = localStorage.getItem('odate_shop') || '';
inputMachine.value = localStorage.getItem('odate_machine') || '';

inputShop.addEventListener('change', () => localStorage.setItem('odate_shop', inputShop.value.trim()));
inputMachine.addEventListener('change', () => localStorage.setItem('odate_machine', inputMachine.value.trim()));

// --- スクショ読み込み ＆ Gemini解析 ---
fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    const apiKey = apiKeyInput.value.trim();
    if (!file) return;
    if (!apiKey) {
        alert('右上の「⚙️ 設定」からGemini APIキーを入力してください');
        settingsModal.classList.add('open');
        return;
    }

    statusDiv.style.color = '#ff9f43';
    statusDiv.innerText = '画像解析中...';

    try {
        const base64Data = await processImage(file);
        const rawResult = await analyzeWithGemini(apiKey, base64Data);
        addSnapshot(rawResult);
        statusDiv.style.color = '#2ecc71';
        statusDiv.innerText = `【${rawResult.invest}P】解析完了！`;
        btnSaveToSheet.style.display = 'block';
    } catch (err) {
        console.error(err);
        statusDiv.style.color = '#e74c3c';
        statusDiv.innerText = 'エラー: ' + err.message;
    }
    fileInput.value = '';
});

function processImage(file) {
    return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const maxW = 800;
            const scale = Math.min(1, maxW / img.width);
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;

            ctx.filter = 'contrast(130%) brightness(105%)';
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', 0.85).split(',')[1]);
        };
        img.src = URL.createObjectURL(file);
    });
}

async function fetchWithRetry(url, options, maxRetries = 3) {
    for (let i = 0; i < maxRetries; i++) {
        const res = await fetch(url, options);
        if (res.status === 503 || res.status === 429) {
            statusDiv.style.color = '#f1c40f';
            statusDiv.innerText = `混雑のため自動再試行中... (${i + 1}/${maxRetries})`;
            await new Promise(r => setTimeout(r, (i + 1) * 1500));
            continue;
        }
        return res;
    }
    return fetch(url, options);
}

async function analyzeWithGemini(apiKey, base64Image) {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`;

    const prompt = `
あなたはパチンコ羽根モノ（おだて豚）データカウンターのOCR専門AIです。
画像全体を確認し、以下の指定ルールに従って13個の【白文字の大きな整数値】を正確に抽出してJSONで返してください。

【項目マッピング】
- target_game: 「対象ゲーム数」の横の数字 (X)
- invest: 1段目左端（お金マークの上） (A:打込ポチ数)
- naki2: 1段目左から2番目（「②」の上） (B:2穴)
- replay: 1段目左から3番目（「リプレイ」の上） (C:リプレイ)
- rep_v: 1段目右端（「リプ→V」の上） (D:リプV)
- pick: 2段目左端（「羽根拾」の上） (E:羽根拾)
- v_hit: 2段目左から2番目（「V入賞」の上） (F:V入賞)
- sp: 2段目左から3番目（「SP」の上） (G:SP)
- sp_v: 2段目右端（「SP→V」の上） (H:SP→V)
- kick: 3段目左端（「拾い→蹴り」の上） (I:蹴り)
- r10: 3段目左から2番目（「当大」の上） (J:10R)
- r5: 3段目左から3番目（「当中」の上） (K:5R)
- r3: 3段目右端（「当小」の上） (L:3R)

必ず以下のJSON形式のみを出力してください:
{
  "target_game": 0, "invest": 0, "naki2": 0, "replay": 0, "rep_v": 0,
  "pick": 0, "v_hit": 0, "sp": 0, "sp_v": 0, "kick": 0,
  "r10": 0, "r5": 0, "r3": 0
}
`;

    const requestBody = {
        contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: "image/jpeg", data: base64Image } }] }],
        generationConfig: { response_mime_type: "application/json" }
    };

    const response = await fetchWithRetry(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(requestBody)
    });

    if (!response.ok) {
        const errorData = await response.json();
        throw new Error(errorData.error?.message || 'Gemini APIエラー');
    }

    const resJson = await response.json();
    return JSON.parse(resJson.candidates[0].content.parts[0].text);
}

// --- スナップショット管理 ＆ テーブル計算 ---
function addSnapshot(data) {
    const idx = snapshots.findIndex(s => s.invest === data.invest);
    if (idx >= 0) snapshots[idx] = data;
    else snapshots.push(data);
    snapshots.sort((a, b) => a.invest - b.invest);
    
    applyRecentN(recentN);
    renderPochiButtons();
    updateTable();
}

function renderPochiButtons() {
    pochiContainer.innerHTML = '';
    snapshots.forEach(s => {
        const btn = document.createElement('button');
        btn.className = `pochi-btn ${selectedPochis.has(s.invest) ? 'active' : ''}`;
        btn.innerText = `${s.invest}P`;
        btn.onclick = () => {
            if (selectedPochis.has(s.invest)) selectedPochis.delete(s.invest);
            else selectedPochis.add(s.invest);
            renderPochiButtons();
            updateTable();
        };
        pochiContainer.appendChild(btn);
    });
}

document.getElementById('btnRecentSub').onclick = () => { if (recentN > 10) { recentN -= 10; document.getElementById('spanN').innerText = recentN; } };
document.getElementById('btnRecentAdd').onclick = () => { recentN += 10; document.getElementById('spanN').innerText = recentN; };
document.getElementById('btnApplyRecent').onclick = () => { applyRecentN(recentN); renderPochiButtons(); updateTable(); };
document.getElementById('btnSelectAll').onclick = () => { snapshots.forEach(s => selectedPochis.add(s.invest)); renderPochiButtons(); updateTable(); };
document.getElementById('btnClearSelect').onclick = () => { selectedPochis.clear(); renderPochiButtons(); updateTable(); };

function applyRecentN(n) {
    selectedPochis.clear();
    if (snapshots.length === 0) return;
    const maxPochi = snapshots[snapshots.length - 1].invest;
    const minTarget = Math.max(0, maxPochi - n);
    snapshots.filter(s => s.invest > minTarget).forEach(s => selectedPochis.add(s.invest));
}

// --- 全18項目の完全計算ロジック ---
function calcMetrics(startSnap, endSnap) {
    if (!endSnap) return null;
    const start = startSnap || { target_game: 0, invest: 0, naki2: 0, replay: 0, rep_v: 0, pick: 0, v_hit: 0, sp: 0, sp_v: 0, kick: 0, r10: 0, r5: 0, r3: 0 };
    
    const X = endSnap.target_game - start.target_game;
    const A = endSnap.invest - start.invest;
    const B = endSnap.naki2 - start.naki2;
    const C = endSnap.replay - start.replay;
    const D = endSnap.rep_v - start.rep_v;
    const E = endSnap.pick - start.pick;
    const F = endSnap.v_hit - start.v_hit;
    const G = endSnap.sp - start.sp;
    const H = endSnap.sp_v - start.sp_v;
    const I = endSnap.kick - start.kick;
    const J = endSnap.r10 - start.r10;
    const K = endSnap.r5 - start.r5;
    const L = endSnap.r3 - start.r3;

    const totalHit = J + K + L;
    const totalBalls = A * 125;

    // 【現状】
    const totalNakiStr = `${X} 回`;
    const naki2ProbStr = B > 0 ? `1/${(X / B).toFixed(1)}` : '-';
    const hitCntStr = `${totalHit} 回`;
    const avgRStr = totalHit > 0 ? `${(((J * 9) + (K * 4) + (L * 2)) / totalHit).toFixed(2)} R` : '-';

    // 【統計】
    const nakiPerKStr = A > 0 ? `${(X / (A / 2)).toFixed(2)} 回` : '-';
    const pickPerKStr = A > 0 ? `${(E / (A / 2)).toFixed(2)} 回` : '-';
    const pickRateStr = X > 0 ? `${((E / X) * 100).toFixed(1)} %` : '-';
    const hitProbStr = totalHit > 0 ? `1/${(X / totalHit).toFixed(1)}` : '-';
    const yakuProbStr = totalHit > 0 ? `1/${(E / totalHit).toFixed(1)}` : '-';

    // 【役物】
    const kickDenom = E - G;
    const kickRateStr = kickDenom > 0 ? `${((I / kickDenom) * 100).toFixed(1)} %` : '-';
    const spRateStr = E > 0 ? `${((G / E) * 100).toFixed(1)} %` : '-';
    const spSuccessStr = G > 0 ? `${((H / G) * 100).toFixed(1)} %` : '-';
    const repSuccessStr = C > 0 ? `${((D / C) * 100).toFixed(1)} %` : '-';

    // 【ヒキ】
    const hikiR = (((J * 9) + (K * 4) + (L * 2)) - (totalHit * 5)) * 110;
    const hikiSp = (H - (G / 3)) * 550;
    const hikiRep = (D - (I / 25.2)) * 550;
    const hikiNorm = (F - (I / 8.4)) * 550;
    const totalHiki = hikiR + hikiSp + hikiRep + hikiNorm;

    const fmtHiki = (val) => {
        const rounded = Math.round(val);
        const sign = rounded > 0 ? `+${rounded.toLocaleString()}` : `${rounded.toLocaleString()}`;
        const cls = rounded > 0 ? 'val-plus' : (rounded < 0 ? 'val-minus' : '');
        return `<span class="${cls}">${sign} 玉</span>`;
    };

    return {
        ballsText: `${A}P (${totalBalls.toLocaleString()}玉)`,
        totalNakiStr, naki2ProbStr, hitCntStr, avgRStr,
        nakiPerKStr, pickPerKStr, pickRateStr, hitProbStr, yakuProbStr,
        kickRateStr, spRateStr, spSuccessStr, repSuccessStr,
        totalHikiHtml: fmtHiki(totalHiki),
        hikiRHtml: fmtHiki(hikiR),
        hikiSpHtml: fmtHiki(hikiSp),
        hikiRepHtml: fmtHiki(hikiRep),
        hikiNormHtml: fmtHiki(hikiNorm)
    };
}

function updateTable() {
    if (snapshots.length === 0) return;

    // 列①：本日全体
    const latest = snapshots[snapshots.length - 1];
    const m1 = calcMetrics(null, latest);
    fillColumn('c1', m1);

    // 列②：選択区間
    if (selectedPochis.size > 0) {
        const sortedSel = Array.from(selectedPochis).sort((a,b)=>a-b);
        const minP = sortedSel[0];
        const maxP = sortedSel[sortedSel.length - 1];
        const endSnap = snapshots.find(s => s.invest === maxP);
        const startIdx = snapshots.findIndex(s => s.invest === minP);
        const startSnap = startIdx > 0 ? snapshots[startIdx - 1] : null;

        const m2 = calcMetrics(startSnap, endSnap);
        fillColumn('c2', m2);
    } else {
        fillColumn('c2', null);
    }

    // 列③：過去台
    updatePastColumn();
}

function fillColumn(prefix, m) {
    document.getElementById(`${prefix}_balls`).innerText = m ? m.ballsText : '-';
    // 現状
    document.getElementById(`${prefix}_total_naki`).innerText = m ? m.totalNakiStr : '-';
    document.getElementById(`${prefix}_naki2_prob`).innerText = m ? m.naki2ProbStr : '-';
    document.getElementById(`${prefix}_hit_cnt`).innerText = m ? m.hitCntStr : '-';
    document.getElementById(`${prefix}_avg_r`).innerText = m ? m.avgRStr : '-';
    // 統計
    document.getElementById(`${prefix}_naki_k`).innerText = m ? m.nakiPerKStr : '-';
    document.getElementById(`${prefix}_pick_k`).innerText = m ? m.pickPerKStr : '-';
    document.getElementById(`${prefix}_pick_r`).innerText = m ? m.pickRateStr : '-';
    document.getElementById(`${prefix}_hit_prob`).innerText = m ? m.hitProbStr : '-';
    document.getElementById(`${prefix}_yaku_prob`).innerText = m ? m.yakuProbStr : '-';
    // 役物
    document.getElementById(`${prefix}_kick_r`).innerText = m ? m.kickRateStr : '-';
    document.getElementById(`${prefix}_sp_r`).innerText = m ? m.spRateStr : '-';
    document.getElementById(`${prefix}_sp_v`).innerText = m ? m.spSuccessStr : '-';
    document.getElementById(`${prefix}_rep_v`).innerText = m ? m.repSuccessStr : '-';
    // ヒキ
    document.getElementById(`${prefix}_total_hiki`).innerHTML = m ? m.totalHikiHtml : '-';
    document.getElementById(`${prefix}_hiki_r`).innerHTML = m ? m.hikiRHtml : '-';
    document.getElementById(`${prefix}_hiki_sp`).innerHTML = m ? m.hikiSpHtml : '-';
    document.getElementById(`${prefix}_hiki_rep`).innerHTML = m ? m.hikiRepHtml : '-';
    document.getElementById(`${prefix}_hiki_norm`).innerHTML = m ? m.hikiNormHtml : '-';
}

// --- スプレッドシート連携 ---
btnSaveToSheet.onclick = async () => {
    const gasUrl = gasUrlInput.value.trim();
    if (!gasUrl) { alert('右上の「⚙️ 設定」からGAS WebApp URLを入力してください'); return; }
    if (snapshots.length === 0) return;

    const latest = snapshots[snapshots.length - 1];
    const payload = {
        date: inputDate.value,
        shop: inputShop.value.trim(),
        machine_number: inputMachine.value.trim(),
        recorder: inputRecorder.value,
        pochi: latest.invest,
        ...latest
    };

    statusDiv.style.color = '#ff9f43';
    statusDiv.innerText = 'スプレッドシートへ保存中...';

    try {
        await fetch(gasUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        statusDiv.style.color = '#2ecc71';
        statusDiv.innerText = `【${latest.invest}P】保存完了！`;
    } catch (e) {
        statusDiv.style.color = '#e74c3c';
        statusDiv.innerText = '保存エラー: ' + e.message;
    }
};

document.getElementById('btnFetchPast').onclick = async () => {
    const gasUrl = gasUrlInput.value.trim();
    const curShop = inputShop.value.trim();
    const curMachine = inputMachine.value.trim();
    if (!gasUrl) { alert('右上の「⚙️ 設定」からGAS WebApp URLを入力してください'); return; }

    statusDiv.style.color = '#ff9f43';
    statusDiv.innerText = '過去データ取得中...';

    try {
        const res = await fetch(gasUrl);
        const list = await res.json();
        pastRecords = list.filter(r => String(r['店舗名']) === curShop && String(r['台番号']) === curMachine);
        
        selectPastData.innerHTML = '<option value="">選択してください</option>';
        pastRecords.forEach((r, idx) => {
            const opt = document.createElement('option');
            opt.value = idx;
            opt.innerText = `${r['日付']} (${r['ポチ数']}P / ${r['記録者']})`;
            selectPastData.appendChild(opt);
        });

        statusDiv.style.color = '#2ecc71';
        statusDiv.innerText = `過去データ ${pastRecords.length}件 取得`;
    } catch (e) {
        statusDiv.style.color = '#e74c3c';
        statusDiv.innerText = '取得失敗: ' + e.message;
    }
};

selectPastData.onchange = () => updatePastColumn();

function updatePastColumn() {
    const idx = selectPastData.value;
    if (idx === '' || !pastRecords[idx]) {
        fillColumn('c3', null);
        return;
    }
    const r = pastRecords[idx];
    const m3 = calcMetrics(null, {
        invest: Number(r['ポチ数'] || r['投資']),
        target_game: Number(r['対象G']),
        naki2: Number(r['②'] || 0),
        replay: Number(r['リプ'] || 0),
        rep_v: Number(r['リプV'] || 0),
        pick: Number(r['羽根拾']),
        v_hit: Number(r['V入賞']),
        sp: Number(r['SP']),
        sp_v: Number(r['SPV']),
        kick: Number(r['拾蹴'] || 0),
        r10: Number(r['当大']),
        r5: Number(r['当中']),
        r3: Number(r['当小'])
    });
    fillColumn('c3', m3);
}
