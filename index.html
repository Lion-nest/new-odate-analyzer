<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>おだて豚 解析診断ツール (v1.0.2)</title>
    <style>
        :root {
            --bg-main: #141419;
            --bg-card: #1f1f28;
            --border-color: #333344;
            --accent-green: #2ecc71;
            --accent-blue: #3498db;
            --accent-yellow: #f1c40f;
            --text-main: #f0f0f0;
        }
        * { box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: var(--bg-main); color: var(--text-main); margin: 0; padding: 14px; font-size: 14px; }
        h1 { font-size: 1.15rem; text-align: center; color: var(--accent-yellow); margin-bottom: 16px; }
        .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; padding: 14px; margin-bottom: 14px; }
        label { font-size: 0.8rem; color: #aaa; display: block; margin-bottom: 4px; }
        input { width: 100%; padding: 10px; background: #111; border: 1px solid var(--border-color); border-radius: 6px; color: #fff; font-size: 0.9rem; margin-bottom: 8px; }
        button { width: 100%; padding: 12px; font-weight: bold; border-radius: 6px; border: none; cursor: pointer; margin-top: 6px; }
        .btn-test1 { background: var(--accent-blue); color: #fff; }
        .log-box { background: #000; border: 1px solid #444; border-radius: 6px; padding: 10px; font-family: monospace; font-size: 0.8rem; white-space: pre-wrap; word-break: break-all; min-height: 80px; max-height: 250px; overflow-y: auto; margin-top: 8px; }
        .ok { color: var(--accent-green); }
        .ng { color: #e74c3c; }
        .warn { color: var(--accent-yellow); }
    </style>
</head>
<body>

<h1>🐷 おだて豚 解析診断ツール <span style="color:#fff; background:#e67e22; padding:2px 6px; border-radius:4px; font-size:0.8rem;">v1.0.2</span></h1>

<!-- 接続情報 -->
<div class="card">
    <label>① Gemini APIキー</label>
    <input type="password" id="apiKey" placeholder="AIzaSy...">
</div>

<!-- 画像OCRテスト（503自動リトライ付き） -->
<div class="card">
    <div style="font-weight: bold; color: var(--accent-green);">【テスト2】スクショ画像 OCR読み取り (自動リトライ対応)</div>
    <div style="font-size: 0.75rem; color: #aaa; margin: 4px 0 8px 0;">失敗したスクショ（IMG_2758, IMG_2521 等）を再度選択してテストしてください。</div>
    <input type="file" id="fileInput" accept="image/*">
    <div id="logOcr" class="log-box">（画像未選択）</div>
</div>

<script>
const apiKeyInput = document.getElementById('apiKey');
const logOcr = document.getElementById('logOcr');

apiKeyInput.value = localStorage.getItem('odate_gemini_key') || '';
apiKeyInput.addEventListener('change', () => localStorage.setItem('odate_gemini_key', apiKeyInput.value.trim()));

// 画像の最適化（リサイズ＋コントラスト強調）
function processImage(file) {
    return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            // サーバー負荷軽減のため横幅を800pxにリサイズ（文字認識には十分）
            const maxW = 800;
            const scale = Math.min(1, maxW / img.width);
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;

            ctx.filter = 'contrast(130%) brightness(105%)';
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', 0.85).split(',')[1]);
        };
        img.src = URL.createObjectURL(file);
    });
}

// 503混雑時に自動で最大3回再試行する送信関数
async function fetchWithRetry(url, options, maxRetries = 3) {
    for (let i = 0; i < maxRetries; i++) {
        const res = await fetch(url, options);
        if (res.status === 503 || res.status === 429) {
            logOcr.innerHTML += `<span class="warn">⚠️ サーバー混雑 (503)。${i + 1}秒後に自動再試行します... (${i + 1}/${maxRetries})</span>\n`;
            await new Promise(r => setTimeout(r, (i + 1) * 1500));
            continue;
        }
        return res;
    }
    return fetch(url, options); // 最後の試行
}

document.getElementById('fileInput').onchange = async (e) => {
    const file = e.target.files[0];
    const key = apiKeyInput.value.trim();
    if (!file || !key) return;

    logOcr.innerHTML = `画像処理＆解析中...\n`;

    try {
        const base64Data = await processImage(file);
        const prompt = `
以下のパチンコカウンター画像から、中央に書かれた大きな整数の数字のみを抽出しJSONで返してください。
- target_game: 「対象ゲーム数」の横の数字
- invest: 1段目左端（お金マーク）
- naki2: 1段目左から2番目（「②」）
- replay: 1段目左から3番目（「リプレイ」）
- rep_v: 1段目右端（「リプ→V」）
- pick: 2段目左端（「羽根拾」）
- v_hit: 2段目左から2番目（「V入賞」）
- sp: 2段目左から3番目（「SP」）
- sp_v: 2段目右端（「SP→V」）
- kick: 3段目左端（「拾い→蹴り」）
- r10: 3段目左から2番目（「当大」）
- r5: 3段目左から3番目（「当中」）
- r3: 3段目右端（「当小」）
※ハイフン「-」は 0。
`;
        const res = await fetchWithRetry(
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${key}`,
            {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: "image/jpeg", data: base64Data } }] }],
                    generationConfig: { response_mime_type: "application/json" }
                })
            }
        );

        const data = await res.json();
        if (res.ok) {
            const text = data.candidates[0].content.parts[0].text;
            logOcr.innerHTML += `<span class="ok">【OCR抽出成功！】</span>\n` + JSON.stringify(JSON.parse(text), null, 2);
        } else {
            logOcr.innerHTML += `<span class="ng">【OCRエラー】</span>\n` + JSON.stringify(data, null, 2);
        }
    } catch (err) {
        logOcr.innerHTML += `<span class="ng">【通信エラー】</span> ` + err.message;
    }
};
</script>

</body>
</html>
