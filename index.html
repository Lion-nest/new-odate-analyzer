<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>おだて豚 解析診断ツール (v1.0)</title>
    <style>
        :root {
            --bg-main: #141419;
            --bg-card: #1f1f28;
            --border-color: #333344;
            --accent-green: #2ecc71;
            --accent-blue: #3498db;
            --accent-yellow: #f1c40f;
            --text-main: #f0f0f0;
        }
        * { box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: var(--bg-main); color: var(--text-main); margin: 0; padding: 14px; font-size: 14px; }
        h1 { font-size: 1.15rem; text-align: center; color: var(--accent-yellow); margin-bottom: 16px; }
        .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; padding: 14px; margin-bottom: 14px; }
        label { font-size: 0.8rem; color: #aaa; display: block; margin-bottom: 4px; }
        input { width: 100%; padding: 10px; background: #111; border: 1px solid var(--border-color); border-radius: 6px; color: #fff; font-size: 0.9rem; margin-bottom: 8px; }
        button { width: 100%; padding: 12px; font-weight: bold; border-radius: 6px; border: none; cursor: pointer; margin-top: 6px; }
        .btn-test1 { background: var(--accent-blue); color: #fff; }
        .btn-test2 { background: var(--accent-green); color: #000; }
        .log-box { background: #000; border: 1px solid #444; border-radius: 6px; padding: 10px; font-family: monospace; font-size: 0.8rem; white-space: pre-wrap; word-break: break-all; min-height: 80px; max-height: 250px; overflow-y: auto; margin-top: 8px; }
        .ok { color: var(--accent-green); }
        .ng { color: #e74c3c; }
    </style>
</head>
<body>

<h1>🐷 おだて豚 解析診断ツール <span style="color:#fff; background:#e67e22; padding:2px 6px; border-radius:4px; font-size:0.8rem;">v1.0</span></h1>

<div class="card">
    <label>① Gemini APIキー</label>
    <input type="password" id="apiKey" placeholder="AIzaSy...">

    <label>② GAS WebApp URL</label>
    <input type="text" id="gasUrl" placeholder="https://script.google.com/...">
</div>

<div class="card">
    <div style="font-weight: bold; color: var(--accent-blue);">【テスト1】Gemini API 接続＆モデル自動判別</div>
    <div style="font-size: 0.75rem; color: #aaa; margin: 4px 0 8px 0;">画像を使わず、APIキーと通信できるか＆どのモデルが使えるかを直接テストします。</div>
    <button class="btn-test1" id="btnTestApi">① Gemini API 接続テスト実行</button>
    <div id="logApi" class="log-box">（テスト未実行）</div>
</div>

<div class="card">
    <div style="font-weight: bold; color: var(--accent-green);">【テスト2】スクショ画像 OCR読み取り</div>
    <div style="font-size: 0.75rem; color: #aaa; margin: 4px 0 8px 0;">スクショを選択して、13項目の数値が正しくJSON抽出できるかをテストします。</div>
    <input type="file" id="fileInput" accept="image/*">
    <div id="logOcr" class="log-box">（画像未選択）</div>
</div>

<div class="card">
    <div style="font-weight: bold; color: var(--accent-yellow);">【テスト3】GAS スプレッドシート保存テスト</div>
    <button class="btn-test2" id="btnTestGas">③ スプレッドシート書込テスト実行</button>
    <div id="logGas" class="log-box">（テスト未実行）</div>
</div>

<script>
const apiKeyInput = document.getElementById('apiKey');
const gasUrlInput = document.getElementById('gasUrl');
const logApi = document.getElementById('logApi');
const logOcr = document.getElementById('logOcr');
const logGas = document.getElementById('logGas');

// ローカル保存
apiKeyInput.value = localStorage.getItem('odate_gemini_key') || '';
gasUrlInput.value = localStorage.getItem('odate_gas_url') || '';
apiKeyInput.addEventListener('change', () => localStorage.setItem('odate_gemini_key', apiKeyInput.value.trim()));
gasUrlInput.addEventListener('change', () => localStorage.setItem('odate_gas_url', gasUrlInput.value.trim()));

let activeModelName = 'gemini-2.5-flash';

// --- テスト1：API接続 ＆ 利用可能モデルの探索 ---
document.getElementById('btnTestApi').onclick = async () => {
    const key = apiKeyInput.value.trim();
    if (!key) { alert('APIキーを入力してください'); return; }
    
    logApi.innerHTML = '接続テスト中...\n';
    const modelsToTry = ['gemini-2.5-flash', 'gemini-2.0-flash', 'gemini-1.5-flash'];
    let success = false;

    for (const m of modelsToTry) {
        logApi.innerHTML += `・モデル [${m}] を試行中... `;
        try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${key}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: "ping" }] }] })
            });
            const data = await res.json();
            if (res.ok) {
                logApi.innerHTML += `<span class="ok">【成功】</span>\n`;
                activeModelName = m;
                success = true;
                logApi.innerHTML += `\n<span class="ok">👉 判定結果: このAPIキーでは [${m}] が正常稼働しています！</span>`;
                break;
            } else {
                logApi.innerHTML += `<span class="ng">【失敗: ${data.error?.message || res.statusText}】</span>\n`;
            }
        } catch (e) {
            logApi.innerHTML += `<span class="ng">【通信エラー: ${e.message}】</span>\n`;
        }
    }

    if (!success) {
        logApi.innerHTML += `\n<span class="ng">❌ すべてのモデルで失敗しました。APIキーが無効か、Google AI Studioの設定を確認してください。</span>`;
    }
};

// --- テスト2：画像OCR ---
document.getElementById('fileInput').onchange = async (e) => {
    const file = e.target.files[0];
    const key = apiKeyInput.value.trim();
    if (!file || !key) return;

    logOcr.innerHTML = `画像解析中（使用モデル: ${activeModelName}）...\n`;

    const reader = new FileReader();
    reader.onload = async () => {
        const base64Data = reader.result.split(',')[1];
        const prompt = `
以下のパチンコカウンター画像から、中央に書かれた大きな整数の数字のみを抽出しJSONで返してください。
- target_game: 「対象ゲーム数」の横の数字
- invest: 1段目左端（お金マーク）
- naki2: 1段目左から2番目（「②」）
- replay: 1段目左から3番目（「リプレイ」）
- rep_v: 1段目右端（「リプ→V」）
- pick: 2段目左端（「羽根拾」）
- v_hit: 2段目左から2番目（「V入賞」）
- sp: 2段目左から3番目（「SP」）
- sp_v: 2段目右端（「SP→V」）
- kick: 3段目左端（「拾い→蹴り」）
- r10: 3段目左から2番目（「当大」）
- r5: 3段目左から3番目（「当中」）
- r3: 3段目右端（「当小」）
※ハイフン「-」は 0。
`;
        try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${activeModelName}:generateContent?key=${key}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: "image/jpeg", data: base64Data } }] }],
                    generationConfig: { response_mime_type: "application/json" }
                })
            });
            const data = await res.json();
            if (res.ok) {
                const text = data.candidates[0].content.parts[0].text;
                logOcr.innerHTML = `<span class="ok">【OCR抽出成功！】</span>\n` + JSON.stringify(JSON.parse(text), null, 2);
            } else {
                logOcr.innerHTML = `<span class="ng">【OCRエラー】</span>\n` + JSON.stringify(data, null, 2);
            }
        } catch (err) {
            logOcr.innerHTML = `<span class="ng">【通信エラー】</span> ` + err.message;
        }
    };
    reader.readAsDataURL(file);
};

// --- テスト3：GAS保存 ---
document.getElementById('btnTestGas').onclick = async () => {
    const url = gasUrlInput.value.trim();
    if (!url) { alert('GAS URLを入力してください'); return; }

    logGas.innerHTML = 'スプレッドシートへテストデータ送信中...\n';
    try {
        await fetch(url, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                date: "2026-09-02",
                shop: "テスト店",
                machine_number: "99",
                recorder: "テスト",
                pochi: 10,
                target_game: 72,
                memo: "疎通テスト成功"
            })
        });
        logGas.innerHTML = `<span class="ok">【送信完了】</span>\nスプレッドシートを開いて、新しい行に「テスト店 / 99番台」が書き込まれているか確認してください！`;
    } catch (e) {
        logGas.innerHTML = `<span class="ng">【送信エラー】</span> ` + e.message;
    }
};
</script>

</body>
</html>
